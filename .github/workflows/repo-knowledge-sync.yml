name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-003). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# Triggers via workflow_run on existing Pages build completion. This is a pure static site
# (HTML/CSS/JS) with no native build — the Pages deployment is the only CI signal. Reading its
# conclusion through the API is cheaper than duplicating the run. paths-ignore on the push trigger
# stops that commit from re-triggering this workflow.

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Sync deterministic state
        if: always()
        run: |
          conclusion="${{ github.event.workflow_run.conclusion }}"
          case "$conclusion" in
            success) build_s="passed";;
            *) build_s="failed";;
          esac
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_s" --build-run-id "${{ github.event.workflow_run.id }}" \
            --test-status unknown --test-summary "Pages deployment (static site, no test suite)"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: always() && github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.event.workflow_run.head_sha }}"
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}
