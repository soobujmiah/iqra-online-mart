name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-003). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# 2026-09-26 fix: this used to trigger via workflow_run on "pages build and deployment". That
# never fired -- confirmed empirically across two real Pages deploys after the listener landed on
# master. Root cause: this repo's Pages source is "legacy" (deploy from branch), so its build is a
# GitHub-internal dynamic workflow, not a workflow defined by a checked-in YAML file, and it does
# not emit a workflow_run-consumable completion event (unlike a real Actions-based Pages workflow,
# e.g. portfolio's "Build and Deploy", where workflow_run does work). Switched to a direct push
# trigger (matching the skb/onskillit-platform pattern). Since there's still no native build step
# for a static site, the sync job polls the actual Pages Builds API
# (GET /repos/:owner/:repo/pages/builds/latest) for the build that matches this exact commit,
# instead of assuming success -- an honest signal, not a fabricated one.

on:
  push:
    branches: [master]
    paths-ignore:
      - '.repo/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: repo-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Wait for this commit's Pages build (build signal)
        id: pages_build
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            resp="$(gh api "repos/${{ github.repository }}/pages/builds/latest")"
            commit="$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
            pg_status="$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            if [ "$commit" = "${{ github.sha }}" ] && { [ "$pg_status" = "built" ] || [ "$pg_status" = "errored" ]; }; then
              echo "status=$pg_status" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "status=timeout" >> "$GITHUB_OUTPUT"

      - name: Sync deterministic state
        if: always()
        run: |
          case "${{ steps.pages_build.outputs.status }}" in
            built) build_s="passed";;
            errored) build_s="failed";;
            *) build_s="unknown";;
          esac
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_s" --build-run-id "${{ github.run_id }}" \
            --test-status unknown --test-summary "Pages deployment (static site, no test suite)" \
            --test-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-name "${{ github.workflow }}" \
            --event-type "${{ github.event_name }}" \
            --actor "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/master'
        env:
          SKB_DISPATCH_TOKEN: ${{ secrets.SKB_DISPATCH_TOKEN || secrets.SKB_RETURN_TOKEN || '' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
          if [ -n "$SKB_DISPATCH_TOKEN" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer $SKB_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/soobujmiah/skb/dispatches \
              -d "{\"event_type\":\"repo-state-updated\",\"client_payload\":{\"project_id\":\"iqra-online-mart\",\"repository\":\"${{ github.repository }}\",\"run_id\":\"${{ github.run_id }}\",\"sha\":\"${{ github.sha }}\"}}" || true
          fi
